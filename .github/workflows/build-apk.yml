name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: 🏗️ Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 Run Engine Unit Tests
        run: npm test

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Compile Standalone Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Installable Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAWA-Winter-Arc-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: release-v1.0.0
          name: FAWA Winter Arc v1.0.0 (Release APK)
          body: |
            ## FAWA Winter Arc — Standalone Release APK

            This is a standalone, offline-first production Release APK with embedded JavaScript bundle.
            - Built with `./gradlew assembleRelease`
            - Signed with debug keystore for easy sideloading without certificate errors
            - Embedded Hermes JS bundle (`index.android.bundle`) — works 100% offline without Metro server or PC connection

            ### Installation:
            1. Download `app-release.apk`
            2. Open the file on your Android phone and install
          files: android/app/build/outputs/apk/release/app-release.apk
